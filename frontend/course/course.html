<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Course Learning</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f8fafc;
}

nav{
    background:#0f172a;
    padding:15px 30px;
    display:flex;
    gap:25px;
    align-items:center;
    border-bottom:1px solid #1e293b;
}

nav a{
    color:white;
    text-decoration:none;
    font-weight:bold;
    cursor:pointer;
}

nav a:hover{
    color:#38bdf8;
}

header{
    background:#0f172a;
    color:white;
    text-align:center;
    padding:20px;
}

.container{
    padding:30px;
    display:grid;
    grid-template-columns:2fr 1fr;
    gap:25px;
}

.video-section,
.lesson-section{
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

iframe{
    width:100%;
    height:400px;
    border:none;
    border-radius:10px;
}

.lesson{
    background:#e2e8f0;
    padding:12px;
    margin-bottom:10px;
    border-radius:8px;
    cursor:pointer;
}

.lesson:hover{
    background:#cbd5e1;
}

button{
    margin-top:20px;
    padding:12px 20px;
    border:none;
    background:#22c55e;
    color:white;
    border-radius:8px;
    cursor:pointer;
}

button:hover{
    background:#16a34a;
}

.progress{
    margin-top:20px;
    background:#ddd;
    border-radius:20px;
    overflow:hidden;
}

.progress-bar{
    height:25px;
    width:0%;
    background:#38bdf8;
    color:white;
    text-align:center;
    line-height:25px;
}

@media(max-width:768px){

.container{
    grid-template-columns:1fr;
}

iframe{
    height:250px;
}

}

</style>
</head>

<body>

<!-- Navigation -->
<nav>
    <a href="#" onclick="goBack(event)">← Back to Dashboard</a>
    <a href="courses.html">Courses</a>
</nav>

<header>
    <h1>Web Development Course</h1>
</header>

<div class="container">

    <!-- Video Area -->

    <div class="video-section">

        <h2>Course Video</h2>
        <p id="courseDescription" style="margin: 15px 0; font-size: 16px; color: #475569; line-height: 1.5;"></p>

        <iframe id="videoPlayer"
        src="https://www.youtube.com/embed/qz0aGYrrlhU">
        </iframe>

        <button onclick="completeCourse()">
            Mark as Completed
        </button>

        <div class="progress">

            <div id="progressBar"
                 class="progress-bar">

                 0%

            </div>

        </div>

    </div>

    <!-- Lesson List -->

    <div class="lesson-section">

        <h2>Lessons</h2>

        <br>

        <div class="lesson"
        onclick="changeVideo('qz0aGYrrlhU')">

        Lesson 1 - HTML Basics

        </div>

        <div class="lesson"
        onclick="changeVideo('UB1O30fR-EE')">

        Lesson 2 - CSS Basics

        </div>

        <div class="lesson"
        onclick="changeVideo('PkZNo7MFNFg')">

        Lesson 3 - JavaScript Basics

        </div>

    </div>

</div>

<script>

const token = localStorage.getItem("token");
const urlParams = new URLSearchParams(window.location.search);
const courseId = urlParams.get("id");

function getYoutubeEmbedUrl(url) {
    if (!url) return "";
    if (url.includes("/embed/")) {
        return url;
    }
    let videoId = "";
    if (url.includes("youtube.com/watch")) {
        try {
            const urlObj = new URL(url);
            videoId = urlObj.searchParams.get("v");
        } catch(e) {}
    } else if (url.includes("youtu.be/")) {
        const parts = url.split("/");
        videoId = parts[parts.length - 1].split("?")[0];
    }
    if (videoId) {
        return `https://www.youtube.com/embed/${videoId}`;
    }
    return url;
}

function goBack(e) {
    if (e) e.preventDefault();
    const role = localStorage.getItem("role");
    if (role === "instructor") {
        window.location.href = "../instructor/instructor.html";
    } else {
        window.location.href = "../student/student.html";
    }
}

async function loadCourseDetails() {
    if (!courseId) {
        alert("No Course ID specified! Redirecting to dashboard.");
        goBack();
        return;
    }

    try {
        const response = await fetch(`http://localhost:5000/api/courses/${courseId}`);
        if (!response.ok) {
            throw new Error("Course not found");
        }
        const course = await response.json();

        // Update UI
        document.querySelector("header h1").textContent = course.title;
        document.getElementById("courseDescription").textContent = course.description || "No description available.";

        if (course.videoUrl) {
            document.getElementById("videoPlayer").src = getYoutubeEmbedUrl(course.videoUrl);
        }
    } catch (error) {
        console.error("Error loading course:", error);
        alert("Error loading course details.");
        goBack();
    }
}

function changeVideo(videoId){
    document.getElementById("videoPlayer").src = "https://www.youtube.com/embed/" + videoId;
}

async function saveProgress(percentage, completed) {
    try {
        await fetch(`http://localhost:5000/api/courses/${courseId}/progress`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${token}`
            },
            body: JSON.stringify({ progressPercentage: percentage, isCompleted: completed })
        });
    } catch (error) {
        console.error("Error saving progress:", error);
    }
}

async function checkAndInitializeProgress() {
    const role = localStorage.getItem("role");
    if (!token || role !== "student" || !courseId) return;

    try {
        const response = await fetch("http://localhost:5000/api/courses/progress/all", {
            headers: {
                "Authorization": `Bearer ${token}`
            }
        });
        const progressList = await response.json();
        const currentProgress = progressList.find(p => p.course && p.course._id === courseId);
        
        let bar = document.getElementById("progressBar");
        if (currentProgress) {
            bar.style.width = `${currentProgress.progressPercentage}%`;
            bar.innerHTML = `${currentProgress.progressPercentage}% Completed`;
        } else {
            await saveProgress(10, false);
            bar.style.width = "10%";
            bar.innerHTML = "10% Completed";
        }
    } catch (error) {
        console.error("Error checking progress:", error);
    }
}

async function completeCourse(){
    let bar = document.getElementById("progressBar");
    bar.style.width = "100%";
    bar.innerHTML = "100% Completed";
    
    const role = localStorage.getItem("role");
    if (token && role === "student" && courseId) {
        await saveProgress(100, true);
    }
}

// Run
async function init() {
    await loadCourseDetails();
    await checkAndInitializeProgress();
}
init();

</script>

</body>
</html>
