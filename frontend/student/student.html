<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Dashboard</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f1f5f9;
}

/* Navbar */

nav{
    background:#0f172a;
    padding:15px 30px;
    display:flex;
    gap:25px;
    align-items:center;
}

nav a{
    color:white;
    text-decoration:none;
    font-weight:bold;
}

nav a:hover{
    color:#38bdf8;
}

/* Header */

header{
    background:#1e293b;
    color:white;
    text-align:center;
    padding:25px;
}

.container{
    padding:30px;
}

/* Courses */

.section-title{
    margin-bottom:20px;
    color:#0f172a;
}

.courses{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
}

.card{
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

.card h3{
    margin-bottom:10px;
}

.card p{
    margin-bottom:15px;
}

.card button{
    padding:10px 15px;
    border:none;
    background:#38bdf8;
    color:white;
    border-radius:6px;
    cursor:pointer;
}

.card button:hover{
    background:#0284c7;
}

/* Progress */

.progress-section{
    margin-top:40px;
}

.progress-box{
    margin-bottom:20px;
}

.progress{
    width:100%;
    background:#ddd;
    border-radius:20px;
    overflow:hidden;
}

.progress-bar{
    height:25px;
    background:#22c55e;
    color:white;
    text-align:center;
    line-height:25px;
}

/* Assignments */

.assignment-section{
    margin-top:40px;
}

.assignment-list{
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

.assignment-btn{
    margin-top:20px;
}

.assignment-btn button{
    margin-right:10px;
    margin-top:10px;
    padding:12px 20px;
    border:none;
    background:#2563eb;
    color:white;
    border-radius:8px;
    cursor:pointer;
}

.assignment-btn button:hover{
    background:#1d4ed8;
}

@media(max-width:768px){

nav{
    flex-wrap:wrap;
}

.container{
    padding:15px;
}

}

</style>
</head>

<body>

<!-- Navigation -->

<nav>

<a href="student.html">Dashboard</a>

<a href="../course/courses.html">Courses</a>

<a href="../assignments/assignments.html">Assignments</a>

<a href="../certificate/certificate.html">Certificate</a>

<a href="../index.html">Logout</a>

</nav>

<!-- Header -->

<header>

<h1>Student Dashboard</h1>

<p>Welcome to your Learning Management System</p>

</header>

<div class="container">

<!-- Courses -->

<h2 class="section-title">My Courses</h2>

<div class="courses" id="coursesContainer">
    <!-- Dynamic courses will load here -->
</div>

<!-- Progress -->

<div class="progress-section" id="progressSection">

<h2 class="section-title">Course Progress</h2>

<div id="progressContainer">
    <!-- Dynamic course progress will load here -->
</div>

</div>

<!-- Assignments -->

<div class="assignment-section">

<h2 class="section-title">Upcoming Assignments</h2>

<div class="assignment-list">

<ul>
<li>Portfolio Website - Due Aug 20</li>
<li>JavaScript Quiz App - Due Aug 25</li>
<li>Machine Learning Mini Project - Due Aug 30</li>
</ul>

<div class="assignment-btn">

<button onclick="window.location.href='../assignments/assignments.html'">
Open Assignments
</button>

<button onclick="window.location.href='../certificate/certificate.html'">
View Certificate
</button>

<button onclick="window.location.href='../course/course.html'">
Open Course
</button>

</div>

</div>

</div>

</div>

<script>
// Check Authentication on Load
const token = localStorage.getItem("token");
const role = localStorage.getItem("role");
const userName = localStorage.getItem("userName");

if (!token || role !== "student") {
    alert("Unauthorized access! Please login first.");
    localStorage.clear();
    window.location.href = "../index.html";
}

// Display student name in header
if (userName) {
    document.querySelector("header p").innerText = `Welcome, ${userName}! Explore your Learning Management System.`;
}

// Fetch courses from backend
async function loadCourses() {
    try {
        const response = await fetch("http://localhost:5000/api/courses");
        const courses = await response.json();

        const container = document.getElementById("coursesContainer");
        container.innerHTML = "";

        if (courses.length === 0) {
            container.innerHTML = "<p style='grid-column: 1/-1; text-align: center; color: #64748b; padding: 20px;'>No courses available at the moment.</p>";
            return;
        }

        courses.forEach(course => {
            const card = document.createElement("div");
            card.className = "card";
            card.innerHTML = `
                <h3>${course.title}</h3>
                <p>${course.description || "No description provided."}</p>
                <button onclick="viewCourse('${course._id}')">View Course</button>
            `;
            container.appendChild(card);
        });
    } catch (error) {
        console.error("Error loading courses:", error);
        document.getElementById("coursesContainer").innerHTML = 
            "<p style='color: #ef4444; grid-column: 1/-1; text-align: center; padding: 20px;'>Failed to load courses from backend server.</p>";
    }
}

function viewCourse(id) {
    window.location.href = `../course/course.html?id=${id}`;
}

// Handle Logout
document.querySelectorAll("nav a").forEach(link => {
    if (link.textContent === "Logout") {
        link.href = "#";
        link.onclick = (e) => {
            e.preventDefault();
            localStorage.clear();
            window.location.href = "../index.html";
        };
    }
});

async function loadProgress() {
    try {
        const response = await fetch("http://localhost:5000/api/courses/progress/all", {
            headers: {
                "Authorization": `Bearer ${token}`
            }
        });
        const progressList = await response.json();

        const container = document.getElementById("progressContainer");
        container.innerHTML = "";

        if (progressList.length === 0) {
            container.innerHTML = "<p style='color: #64748b; padding: 10px 0;'>You have not started any courses yet.</p>";
            return;
        }

        progressList.forEach(item => {
            if (!item.course) return; // skip if course deleted
            const box = document.createElement("div");
            box.className = "progress-box";
            box.style.marginBottom = "20px";
            box.innerHTML = `
                <p style="margin-bottom: 5px; font-weight: bold;">${item.course.title}</p>
                <div class="progress">
                    <div class="progress-bar" style="width:${item.progressPercentage}%">
                        ${item.progressPercentage}%
                    </div>
                </div>
            `;
            container.appendChild(box);
        });
    } catch (error) {
        console.error("Error loading progress:", error);
    }
}

// Run
loadCourses();
loadProgress();
</script>

</body>
</html>
